server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: common-chat-backend
  datasource:
    url: jdbc:h2:file:./data/common_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

common:
  chat:
    allowed-origins: ${COMMON_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}
    session-token-validity-hours: 72
    heartbeat-interval-seconds: 25
    heartbeat-timeout-seconds: 60
    max-message-length: 4000
    rate-limit:
      login-attempts-per-minute: 10
      messages-per-second: 5
